openapi: 3.0.3
info:
  title: ms-customer API
  version: 1.0.0
  description: |
    Customer management (personal and business).
    
    Conventions:
    - Amounts are decimals with two fraction digits (`multipleOf: 0.01`) plus an ISO 4217 `currency`.
      Generators must map them to BigDecimal, never to floating point.
    - List endpoints can be consumed as `application/json` (array) or `application/x-ndjson` (reactive stream).
    - Errors follow RFC 7807 (`application/problem+json`): 400 validation, 404 not found,
      409 duplicate or concurrent modification (retry), 422 business rule violated, 503 downstream failure.
    - Part I has no authentication (JWT is added in Part III).
    
    Database: PostgreSQL (R2DBC).
servers:
  - url: http://localhost:8081
    description: ms-customer (local)

tags:
  - name: Customers
    description: ms-customer

paths:
  /api/v1/customers:
    get:
      tags: [Customers]
      operationId: findAllCustomers
      summary: List active customers (paginated)
      parameters:
        - name: customerType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CustomerType'
        - name: status
          in: query
          required: false
          description: Lifecycle status filter. Defaults to ACTIVE.
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, ALL]
            default: ACTIVE
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Customers found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/Customer'
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '201':
          description: Customer created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Customers]
      operationId: findCustomerById
      summary: Get an active customer by id
      description: Returns 404 when the customer does not exist or is inactive.
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Customers]
      operationId: deleteCustomer
      summary: Delete a customer
      description: |
        Logical deletion: the customer is marked `INACTIVE` so products already opened in
        ms-acount and ms-credit are not orphaned. Inactive customers cannot open new products.
      responses:
        '204':
          description: Customer deleted (marked INACTIVE)
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/customers/{customerId}/activate:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    patch:
      tags: [Customers]
      operationId: activateCustomer
      summary: Reactivate an inactive customer
      responses:
        '200':
          description: Customer activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index. Results are ordered by createdAt and id, so pages are stable.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request (validation errors)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Duplicate resource or concurrent modification (retry the request)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CustomerType:
      type: string
      enum: [PERSONAL, BUSINESS]
    CustomerProfile:
      type: string
      enum: [VIP, PYME]
    DocumentType:
      type: string
      enum: [DNI, CEX, PASSPORT, RUC]
    CustomerStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    CustomerRequest:
      type: object
      required: [customerType, documentType, documentNumber, name]
      additionalProperties: false
      properties:
        customerType:
          $ref: '#/components/schemas/CustomerType'
        customerProfile:
          allOf:
            - $ref: '#/components/schemas/CustomerProfile'
          description: Optional profile chosen at customer creation; VIP requires PERSONAL and PYME requires BUSINESS.
        documentType:
          $ref: '#/components/schemas/DocumentType'
        documentNumber:
          type: string
          minLength: 6
          maxLength: 20
          example: '72345678'
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: Full name (PERSONAL) or business name (BUSINESS)
          example: Maria Lopez
        email:
          type: string
          format: email
          maxLength: 254
          example: maria.lopez@example.com
        phone:
          type: string
          pattern: '^[0-9+() .-]{6,32}$'
          example: '987654321'
        address:
          type: string
          example: Av. Principal 123
    CustomerUpdateRequest:
      type: object
      description: Full update of editable fields; customerType and customerProfile are immutable.
      required: [documentType, documentNumber, name]
      additionalProperties: false
      properties:
        documentType:
          $ref: '#/components/schemas/DocumentType'
        documentNumber:
          type: string
          minLength: 6
          maxLength: 20
          example: '72345678'
        name:
          type: string
          maxLength: 150
          description: Full name (PERSONAL) or business name (BUSINESS)
          example: Maria Lopez
        email:
          type: string
          format: email
          example: maria.lopez@example.com
        phone:
          type: string
          example: '987654321'
        address:
          type: string
          example: Av. Principal 123
    Customer:
      type: object
      required: [id, customerType, documentType, documentNumber, name, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        customerType:
          $ref: '#/components/schemas/CustomerType'
        customerProfile:
          allOf:
            - $ref: '#/components/schemas/CustomerProfile'
          description: Optional profile selected when the customer was created.
        documentType:
          $ref: '#/components/schemas/DocumentType'
        documentNumber:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        status:
          $ref: '#/components/schemas/CustomerStatus'
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: RFC 7807 problem details
      required: [status, title]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Business rule violated
        status:
          type: integer
          example: 422
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          description: Field-level validation errors (400)
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
